name : Java CI with Maven

on:
  push:
    branches: ["EniolaBranch"]
  pull_request:
    branches: ["EniolaBranch"]

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017


    steps:
      - uses: actions/checkout@v1
      - name: Set up JDK 21
        uses: actions/setup-java@v1
        with:
          java-version: '21'
      - name: Maven Package
        run: mvn -B clean package -DskipTests --file rmis/pom.xml
      - name: Maven Verify
        run: mvn -B clean verify  --file rmis/pom.xml

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml
        working-directory: ./rmis

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [ test, build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/rmis:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/rmis:latest