name : Java CI with Maven

on:
  push:
    branches: ["EniolaBranch"]
  pull_request:
    branches: ["EniolaBranch"]

jobs:
  test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Set up JDK 21
        uses: actions/setup-java@v1
        with:
          java-version: '21'
      - name: Maven Package
        run: mvn -B clean package -DskipTests --file rmis/pom.xml
      - name: Maven Verify
        run: mvn -B clean verify  --file rmis/pom.xml
